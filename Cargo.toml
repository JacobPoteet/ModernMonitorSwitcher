[workspace]
resolver = "2"
members = ["msw-core", "msw-cli", "msw-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
repository = "https://github.com/JacobPoteet/ModernMonitorSwitcher"
authors = ["Jacob Poteet"]

[workspace.dependencies]
msw-core = { path = "msw-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
