name: CI

# Deliberately fast. This checks msw-core and msw-cli, which hold all the
# logic and all but a handful of the tests, and which together compile in
# seconds because they depend on little more than the Windows crate.
#
# msw-app is not built here. It pulls in the whole Tauri dependency tree,
# several hundred crates, and compiling that on every push costs many minutes
# to tell us something a local build already told us. It is built when a tag
# is pushed, by the release workflow, which has to build it anyway.
#
# The trade: a change that breaks only msw-app surfaces at release time rather
# than on push. That is worth it at this size; if this ever grows more than one
# developer, put msw-app back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting does not compile anything, so it covers the whole
      # workspace including msw-app.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p msw-core -p msw-cli --all-targets -- -D warnings

      - name: Test
        run: cargo test -p msw-core -p msw-cli
