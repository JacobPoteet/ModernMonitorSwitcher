name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # msw-app declares msw.exe as a Tauri sidecar, and its build script fails
      # if the file is not there. So this has to come before anything that
      # compiles the workspace, including clippy and the tests.
      - name: Build and stage the CLI sidecar
        run: |
          cargo build --release -p msw-cli
          New-Item -ItemType Directory -Force -Path msw-app/binaries | Out-Null
          Copy-Item target/release/msw.exe msw-app/binaries/msw-x86_64-pc-windows-msvc.exe

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release
