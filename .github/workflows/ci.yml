name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # msw-app declares msw.exe as a Tauri sidecar, and its build script fails
      # if the file is not there. So this has to come before anything that
      # compiles the workspace, including clippy and the tests.
      #
      # A debug build is enough: nothing here ships, the file only has to
      # exist and be a real executable. Building it in release would compile a
      # second copy of the dependency tree for no benefit.
      - name: Build and stage the CLI sidecar
        run: |
          cargo build -p msw-cli
          New-Item -ItemType Directory -Force -Path msw-app/binaries | Out-Null
          Copy-Item target/debug/msw.exe msw-app/binaries/msw-x86_64-pc-windows-msvc.exe

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Deliberately no release build here. It would mean compiling the whole
      # Tauri tree again under a different profile, for several minutes, to
      # catch the rare failure that only the release profile provokes. The
      # release workflow does a real release build when a tag is pushed, which
      # is early enough.
